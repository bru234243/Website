<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — Donations</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <script src="admin.js" defer></script>
</head>
<body>
  <h1>Admin Panel</h1>
  <div id="login" class="card">
    <h2>Login</h2>
    <input id="username" placeholder="username" value="Owner javkha" />
    <input id="password" placeholder="password" type="password" />
    <button id="btn-login">Login</button>
  </div>

  <div id="panel" style="display:none">
    <div class="card">
      <button id="btn-logout">Logout</button>
      <button id="btn-export">Export CSV</button>
      <button id="btn-refresh">Refresh</button>
      <div id="stats"></div>
      <table>
        <thead><tr><th>ID</th><th>Name</th><th>Amount</th><th>Note</th><th>Date</th><th>Received</th><th>Action</th></tr></thead>
        <tbody id="donors"></tbody>
      </table>
    </div>
  </div>
</body>
</html>
